# YAML build file
# nx-apphub-cli 2025 (c) Nitrux Latinoamericana S.C.

buildinfo:
  name: nano
  version: 9.0-1
  binarypath: /usr/bin/nano
  os-target: 6.1.0
  distrorepo:
    - distro: debian-snapshot
      snapshot: 20260514T142722Z
      release: testing
      arch: arm64
      components:
        - main
  deps:
    - libncursesw6
    - libtinfo6
    - nano
  runtime: uruntime

apprunconf:
  setpath: "/usr/bin"
  setlibpath: "/usr/lib"
  exec: "/usr/bin/nano"
  envvars: {}
  prebuild-commands: []

sandbox:
  type: bwrap
  dev: true
  proc: true
  tmpfs: true
  unshare-user: true
  unshare-uts: true
  cap-drop-all: true
  die-with-parent: true
  bind:
    - "$HOME:$HOME"
    - ~/.config:~/.config
    - ~/.local:~/.local
  ro-bind:
    - "$APPDIR:$APPDIR"
    - /lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu
    - /usr/share/terminfo:/usr/share/terminfo
  bwrap-env:
    - HOME: "$HOME"
  bwrap-unset-env:
    - DISPLAY

integration:
  type: cli
