buildinfo:
  name: kitty
  version: 0.47.4-1+b1
  binarypath: /usr/bin/kitty
  os-target: 7.0.0
  distrorepo:
    - distro: debian-snapshot
      snapshot: 20260725T202958Z
      release: testing
      arch: arm64
      components:
        - main
  deps:
    - kitty-shell-integration
    - kitty-terminfo
    - python3
    - python3.14
    - libcairo2
    - libdbus-1-3
    - libfreetype6
    - libharfbuzz0b
    - liblcms2-2
    - libpng16-16t64
    - libpython3.14
    - libssl3t64
    - libwayland-client0
    - libx11-6
    - libx11-xcb1
    - libxcursor1
    - libxkbcommon-x11-0
    - libxkbcommon0
    - libxxhash0
    - zlib1g
    - kitty
  runtime: uruntime

apprunconf:
  exec: /usr/bin/kitty
  setpath: /usr/bin
  setlibpath: /usr/lib
  envvars:
    DISPLAY: "$DISPLAY"
    WAYLAND_DISPLAY: "$WAYLAND_DISPLAY"
    XDG_RUNTIME_DIR: "$XDG_RUNTIME_DIR"
    XKB_CONFIG_ROOT: "$APPDIR/usr/share/X11/xkb"

sandbox:
  type: bwrap
  ro-root: true
  dev: true
  proc: true
  die-with-parent: true
  bind:
    - "$HOME:$HOME"
    - ~/.config:~/.config
    - ~/.local:~/.local
    - "$XDG_RUNTIME_DIR:$XDG_RUNTIME_DIR"
    - /dev/shm:/dev/shm
    - /dev/dri/renderD128:/dev/dri/renderD128
  bind-try:
    - /run/dbus:/run/dbus
    - /run/udev:/run/udev
    - /tmp:/tmp
  ro-bind-try:
    - ~/.config/kdedefaults:~/.config/kdedefaults
  bwrap-env:
    - HOME: "$HOME"
    - LANG: "en_US.UTF-8"
    - DISPLAY: "$DISPLAY"
    - WAYLAND_DISPLAY: "$WAYLAND_DISPLAY"
    - XDG_RUNTIME_DIR: "$XDG_RUNTIME_DIR"

integration:
  type: gui
  launcher: kitty.desktop
