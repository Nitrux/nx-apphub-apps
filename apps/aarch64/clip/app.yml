# YAML build file
# nx-apphub-cli 2025 (c) Nitrux Latinoamericana S.C.

buildinfo:
  name: clip
  version: 4.0.3-19
  binarypath: /usr/bin/clip
  os-target: 6.1.0
  distrorepo:
    - distro: debian-snapshot
      snapshot: 20260725T202958Z
      release: testing
      arch: arm64
      components:
        - main
    - distro: nitrux
      release: duke
      arch: amd64
  deps:
    - clip
    - libmpv2
    - qml6-module-qt-labs-settings
    - libblas3
    - liblapack3
    - libcdio-paranoia2t64
    - libcdio-cdda2t64
    - libmujs3
    - libavdevice62
    - liblua5.2-0
    - libsixel1
    - libva-wayland2
    - libavc1394-0
    - libopenal1
    - libdc1394-25
  runtime: uruntime

apprunconf:
  setpath: "/usr/bin"
  setlibpath: "/usr/lib"
  exec: "/usr/bin/clip"
  envvars:
    QT_QPA_PLATFORM: "wayland;xcb"
    QT_QPA_PLATFORMTHEME: ""
    QT_PLUGIN_PATH: "$APPDIR/usr/lib/aarch64-linux-gnu/qt5/plugins:$APPDIR/usr/lib/aarch64-linux-gnu/qt6/plugins"
    QT_QML_IMPORT_PATH: "$APPDIR/usr/lib/aarch64-linux-gnu/qt5/qml:$APPDIR/usr/lib/aarch64-linux-gnu/qt6/qml"
    QML_IMPORT_PATH: "$APPDIR/usr/lib/aarch64-linux-gnu/qt6/qml"
    QML2_IMPORT_PATH: "$APPDIR/usr/lib/aarch64-linux-gnu/qt5/qml"
    SESSION_MANAGER: ""
    XKB_CONFIG_ROOT: "$APPDIR/usr/share/X11/xkb"
    XDG_CURRENT_DESKTOP: "KDE"
    KDE_FULL_SESSION: "true"
    KDE_SESSION_VERSION: "6"
    XDG_CONFIG_DIRS: "$HOME/.config/kdedefaults:/etc/xdg"
  extra-rpaths:
    - "$ORIGIN/../../usr/lib/aarch64-linux-gnu/blas"
    - "$ORIGIN/../../usr/lib/aarch64-linux-gnu/lapack"
  prebuild-commands:
    - "rm -f $APPDIR/usr/share/metainfo/org.kde.clip.appdata.xml"

sandbox:
  type: bwrap
  dev: true
  proc: true
  tmpfs: true
  unshare-user: true
  unshare-uts: true
  cap-drop-all: true
  die-with-parent: true
  bind:
    - "$HOME:$HOME"
    - ~/.config:~/.config
    - ~/.local:~/.local
    - "$XDG_RUNTIME_DIR:$XDG_RUNTIME_DIR"
    - /dev/shm:/dev/shm
    - /dev/dri/renderD128:/dev/dri/renderD128
  ro-bind:
    - "$APPDIR:$APPDIR"
    - /lib:/lib
    - /lib64:/lib64
    - /usr:/usr
    - /bin:/bin
    - /sbin:/sbin
    - /etc/fonts:/etc/fonts
    - /etc/xdg:/etc/xdg
  bwrap-env:
    - HOME: "$HOME"
    - LANG: "en_US.UTF-8"
    - XDG_RUNTIME_DIR: "$XDG_RUNTIME_DIR"
    - WAYLAND_DISPLAY: "$WAYLAND_DISPLAY"
    - PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  bwrap-unset-env:
    - DISPLAY
    - QT_QPA_PLATFORMTHEME

integration:
  type: gui
