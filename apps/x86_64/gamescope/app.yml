# YAML build file
# nx-apphub-cli 2025 (c) Nitrux Latinoamericana S.C.

buildinfo:
  name: gamescope
  version: 3.16.24+ds-1
  binarypath: /usr/games/gamescope
  os-target: 7.0.0
  distrorepo:
    - distro: debian-snapshot
      snapshot: 20260725T202958Z
      release: testing
      arch: amd64
      components:
        - main
        - contrib
  deps:
    - gamescope
    - libavif16
    - libcap2
    - libdecor-0-0
    - libdisplay-info3
    - libeis1
    - libinput10
    - libjsoncpp26
    - libliftoff0
    - libluajit-5.1-2
    - libopenvr-api2
    - libpipewire-0.3-0t64
    - libpixman-1-0
    - libsdl2-2.0-0
    - libudev1
    - libwlroots-0.20
    - libx11-6
    - libx11-xcb1
    - libxcb-ewmh2
    - libxcb1
    - libxcomposite1
    - libxcursor1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxi6
    - libxkbcommon0
    - libxmu6
    - libxrender1
    - libxres1
    - libxtst6
    - libxxf86vm1
    - xwayland
  runtime: uruntime

apprunconf:
  setpath: "/usr/bin"
  setlibpath: "/usr/lib"
  exec: "/usr/bin/gamescope-startup-wrapper"
  envvars:
    WAYLAND_DISPLAY: "$WAYLAND_DISPLAY"
    XDG_RUNTIME_DIR: "$XDG_RUNTIME_DIR"

sandbox:
  type: none

integration:
  type: cli
