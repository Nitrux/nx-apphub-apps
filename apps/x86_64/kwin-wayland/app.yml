# YAML build file
# nx-apphub-cli 2025 (c) Nitrux Latinoamericana S.C.

buildinfo:
  name: kwin-wayland
  version: 4:6.6.5-2
  binarypath: /usr/bin/kwin_wayland
  os-target: 7.0.0
  distrorepo:
    - distro: debian-snapshot
      snapshot: 20260725T202958Z
      release: testing
      arch: amd64
      components:
        - main
  deps:
    - hwdata
    - kwin-common
    - kwin-wayland
    - libcanberra0
    - libcap2-bin
    - libepoxy0
    - libkdecorations3-6
    - libkf6configcore6
    - libkf6configgui6
    - libkf6coreaddons6
    - libkf6crash6
    - libkf6dbusaddons6
    - libkf6globalaccel6
    - libkf6runner6
    - milou
    - libkf6holidays6
    - libkf6i18n6
    - libkf6itemmodels6
    - libkf6idletime6
    - libkf6notifications6
    - libkf6newstuffwidgets6
    - libkf6screendpms8
    - libkf6svg6
    - libkf6windowsystem6
    - libknighttime0
    - libkscreenlocker6
    - libkglobalacceld0
    - libkwin6
    - libqaccessibilityclient-qt6-0
    - libqt6core6t64
    - libqt6dbus6
    - libqt6gui6
    - libqt6qml6
    - libqt6quick6
    - libqt6uitools6
    - libqt6widgets6
    - libeis1
    - libxcb-composite0
    - libxcb-dpms0
    - libxcb-ewmh2
    - libxcb-randr0
    - libxcb-record0
    - libxcb-xfixes0
    - libxcb1
    - xwayland
  runtime: uruntime

apprunconf:
  exec: /usr/bin/kwin_wayland
  setpath: /usr/bin
  setlibpath: /usr/lib
  envvars:
    QT_QPA_PLATFORM: "wayland;xcb"
    QT_PLUGIN_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu/qt6/plugins"
    QT_QML_IMPORT_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu/qt6/qml"
    QML_IMPORT_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu/qt6/qml"
    QML2_IMPORT_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu/qt6/qml"
    XKB_CONFIG_ROOT: "$APPDIR/usr/share/X11/xkb"
    WAYLAND_DISPLAY: "$WAYLAND_DISPLAY"
    XDG_RUNTIME_DIR: "$XDG_RUNTIME_DIR"
    DBUS_SESSION_BUS_ADDRESS: "$DBUS_SESSION_BUS_ADDRESS"

sandbox:
  type: none

integration:
  type: cli
