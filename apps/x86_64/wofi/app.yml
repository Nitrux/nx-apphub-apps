buildinfo:
  name: wofi
  version: 1.5.3-1
  binarypath: /usr/bin/wofi
  os-target: 7.0.0
  distrorepo:
    - distro: debian-snapshot
      snapshot: 20260725T202958Z
      release: testing
      arch: amd64
      components:
        - main
  deps:
    - libcairo2
    - libgdk-pixbuf-2.0-0
    - libgtk-3-0t64
    - libpango-1.0-0
    - wofi
  runtime: uruntime

apprunconf:
  setpath: "/usr/bin"
  setlibpath: "/usr/lib"
  exec: "/usr/bin/wofi"
  envvars:
    GDK_BACKEND: "wayland,x11"
    WAYLAND_DISPLAY: "$WAYLAND_DISPLAY"
    XKB_CONFIG_ROOT: "$APPDIR/usr/share/X11/xkb"
    XDG_RUNTIME_DIR: "$XDG_RUNTIME_DIR"

sandbox:
  type: bwrap
  ro-root: true
  dev: true
  proc: true
  die-with-parent: true
  bind:
    - "$HOME:$HOME"
    - ~/.config:~/.config
    - ~/.local:~/.local
    - "$XDG_RUNTIME_DIR:$XDG_RUNTIME_DIR"
    - /dev/shm:/dev/shm
  bind-try:
    - /run/dbus:/run/dbus
    - /run/udev:/run/udev
    - /tmp:/tmp
  bwrap-env:
    - HOME: "$HOME"
    - LANG: "en_US.UTF-8"
    - XDG_RUNTIME_DIR: "$XDG_RUNTIME_DIR"
    - WAYLAND_DISPLAY: "$WAYLAND_DISPLAY"
    - DBUS_SESSION_BUS_ADDRESS: "$DBUS_SESSION_BUS_ADDRESS"
    - DBUS_SYSTEM_BUS_ADDRESS: "unix:path=/run/dbus/system_bus_socket"

integration:
  type: cli
